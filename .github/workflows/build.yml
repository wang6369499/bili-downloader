name: 打包 B站下载器

# 触发方式：
#   1) 推送代码到 main/master 自动构建
#   2) 在 GitHub 仓库的 Actions 页面点「Run workflow」手动构建
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: 生成 Windows exe
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包
        run: pyinstaller bilibili_downloader.spec --clean --noconfirm

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: B站下载器-Windows-exe
          path: dist/*.exe
          if-no-files-found: error

  build-macos:
    name: 生成 macOS app
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包
        run: pyinstaller bilibili_downloader.spec --clean --noconfirm

      - name: 上传 app
        uses: actions/upload-artifact@v4
        with:
          name: B站下载器-macOS-app
          path: dist/*.app
          if-no-files-found: error
